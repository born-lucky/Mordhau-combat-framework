[package]
name = "mordhau-core"
description = "Engine-neutral Mordhau simulation core: UE math (ue), spec data layer, combat ported from the decomp"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
# the GDScript reference model (World::new_reference, Precision::Reference) for the golden traces; the default build is
# exe-exact (World::new)
reference_compat = []

# golden-trace parity: replays core/tests/scenarios/*.json against core/tests/golden/** (export_golden.gd)
[[test]]
name = "golden"
path = "../../tests/golden.rs"
required-features = ["reference_compat"]
