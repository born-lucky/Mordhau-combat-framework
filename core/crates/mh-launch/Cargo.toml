[package]
name = "mh-launch"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The double-click launcher (user, 2026-10-06: "create an exe so I can just run the project"): MordhauRewrite.exe at the
# repo root starts the current release build the way scripts/runtime/play.ps1 does. No dependencies.
[[bin]]
name = "MordhauRewrite"
path = "src/main.rs"

[dependencies]
mh-install = { path = "../mh-install" }
