[package]
name = "mh-audio"
description = "Bevy audio plugin: SoundCue playback (mh-assets sound_cue evaluate_ctx) with UE distance attenuation / doppler, an event log for evidence; AudioStarted messages (with the waves' Ogg bytes on request) for an output backend"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
mh-pak = { path = "../mh-pak" }
mh-assets = { path = "../mh-assets" }
mh-ui = { path = "../mh-ui" }
serde_json.workspace = true
bevy = { version = "0.19.1", default-features = false, features = [
    "std", "multi_threaded", "async_executor", "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    "bevy_window", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light", "bevy_camera",
    "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_mikktspace",
    "bevy_gltf", "bevy_scene", "bevy_world_serialization", "bevy_animation", "gltf_animation",
    "bevy_text", "bevy_ui", "bevy_ui_render", "default_font",
    "bevy_post_process", "png", "tonemapping_luts", "ktx2", "zstd_rust", "keyboard", "mouse",
    "bevy_audio",
] }
# Ogg Vorbis decode for the software mixer voice (mixer.rs); bevy_audio (rodio) plays its output on the device
lewton = "0.10"
# map AudioComponents / AudioVolumes (ambient.rs); no collision world
mh-level = { path = "../mh-level", default-features = false }
# the Source trait bevy_audio's Decodable needs (the same rodio bevy_audio 0.19 uses)
rodio = { version = "0.22", default-features = false }
