[package]
name = "mh-mode"
description = "Engine-neutral Mordhau game modes (MordhauGameMode + FFA/TDM/SKM/DU/TF/FL, ControlPoint) and bots (AMordhauAIController, behavior tree, BT tasks), ported from godot/game/mode + godot/game/ai"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
mordhau-core = { path = "../mordhau-core" }
# ModeData::from_spec (src/spec_load.rs): the mode records from the spec matrix (sheets builder)
mh-spec = { path = "../mh-spec" }
serde.workspace = true
# float_roundtrip: exact float parsing (the golden traces compare bit-exact f64)
serde_json = { workspace = true, features = ["float_roundtrip"] }

[features]
# the GDScript reference reproduced bit for bit (GameMode::new_reference, Bots precision Reference): the golden traces.
# The default build is exe-exact (binary32, UWorld TimeSeconds clock).
reference_compat = []

[[test]]
name = "golden_mode"
required-features = ["reference_compat"]
